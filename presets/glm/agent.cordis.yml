# The `glm` agent preset (dsh-glm plugin): a GLM-tuned coding agent.
#
# v0.4.1 compat fixes (dsh 0.2.2-rc.1 live verification, 2026-11-09):
#   - `@deepseek-ai/dsh-tool-subagent-control/list-agents` subpath does not
#     exist → row removed (the control tool itself remains).
#   - `backgroundMode` is not a dsh-tool-subagent config key in 0.2.x →
#     removed; spawn row gains modelSelection/modelDiscovery like the shipped
#     `ptc` preset.
#   - `@deepseek-ai/dsh-workflow-worker-thread` does not exist → replaced by
#     `@deepseek-ai/dsh-workflow-ptc` (provider: spawn).
#   - `@deepseek-ai/dsh-agent-tool-presentation` is deprecated → replaced by
#     `@deepseek-ai/dsh-tool-executor-ptc`.
#
# IMPORTANT: on current harness versions presets are bundle declarations;
# cordis.patch.yml carries an inline copy of this list for the
# `preset-glm` declaration. Keep the two files in sync when editing rows.
# This directory remains the source for the legacy `.agent-presets/<id>`
# install path (older harness releases read it; the plugin keeps copying it).
#
# Design notes:
#   - Based on the built-in `code` (PTC) preset: the FULL standard tool
#     catalog presented through Code Mode (programmatic tool calling) — no
#     DeepSeek-style minimal anchor bootstrap. GLM-5.3-flash is a frontier
#     coding model (AA index 57, Opus-4.8-class coding); presenting the
#     catalog as a Code Mode SDK lets it compose multi-step operations in one
#     TypeScript program instead of per-call JSON round trips.
#   - Wire-level tuning lives on the llm-pi-ai zhipuai route (settings.yaml):
#     compat.thinkingFormat: zai sends thinking:{type:enabled,clear_thinking:false}
#     + reasoning_effort (official GLM-5.3-flash recommendation), and the route
#     declares input:[text,image] for native multimodal. The pi-ai layer sends
#     tool_stream:true for this gateway's GLM models (patched detectCompat).
#   - Compaction: this preset publishes its OWN isolated compaction owner
#     (GLM thresholds 0.75/0.22) — the designed "nearest owner wins" seam.
#     This is deterministic regardless of which host plugin (dsh-kiro or
#     dsh-glm) mounted the host-plane engine first, and a host Kiro engine
#     would otherwise only offer GLM sessions its 0.98 overflow fallback.
#     After compaction the engine swaps history for a summary; the persona
#     instructs the model to continue seamlessly from it.
#   - Request-cache stability: the PTC catalog is frozen for the session
#     (plan mode keeps it unchanged), and the persona only embeds
#     {{model}}/{{cwd}} — the implicit prefix cache (verified live:
#     cached_tokens on repeat prefixes) stays warm. Switching presets
#     rebuilds the prefix once; within a GLM session nothing shifts.
#
# A service row here MUST sit inside a group carrying an `isolate` realm
# (see the shipped `standard`/`code` presets for the full rationale).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model (GLM-5 series, natively multimodal: read images and screenshots the user attaches directly instead of claiming you cannot see them). Your working directory is {{cwd}}.
      Keep execution lifecycles tight: use a background continuable subagent only when parallel work or a later follow-up is genuinely useful; for a one-shot delegation whose result is needed now and will not be reused, set run_in_background to false so the run is awaited and its live resources are disposed before continuing. Interrupt a running subagent once its remaining work is no longer needed. Collect completed background jobs, kill jobs that stopped mattering, and leave no relevant job running when the task ends. A ready subagent is storage-only resumable history, not live work, so do not delete or restart it merely to clean up resources.
      When several tool calls are independent, issue them in the same turn as parallel calls: it cuts round trips and your per-turn thinking overhead. Keep tool call arguments compact — defer to file paths and identifiers rather than re-pasting large content.
      When an automatic context compaction happens, the earlier conversation is replaced by a summary in place: treat that summary as your durable memory and continue the task from it without asking the user to repeat anything.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# GLM 专属自动压缩（Codex 式）：预设内自带隔离 owner —— 官方 "nearest owner
# wins" 语义，host 平面的 Kiro/GLM 兜底引擎对本预设会话自动退位，杜绝双引擎
# 阈值冲突。压缩引擎把早期历史换成原地摘要后任务无缝续跑（persona 已配套指令）。
#
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. `tokenMeter` deliberately
# stays on the HOST plane (see the shipped `standard` preset rationale).
#
# 阈值：GLM-5.3-flash 上下文 1M，75% 触发 / 保留 22%——与 Kiro 模式同哲学，
# 给压缩摘要 + 续跑留出充足余量；推理型模型压缩后重放前缀仍命中隐式缓存。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.75
        retainRatio: 0.22
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelection: true
        modelDiscovery: true

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    # @deepseek-ai/dsh-workflow-worker-thread does not exist in dsh 0.2.x —
    # the shipped `ptc` preset mounts `dsh-workflow-ptc` (provider: spawn) in
    # this group instead. Same isolate realm (workflowEngine) applies.
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── presentation ────────────────────────────────────────────────────────────

# PTC (Code Mode) for this agent alone, mirroring the shipped `ptc` preset:
# the full standard catalog is presented through the Code Mode SDK so the
# model composes multi-step operations in one TypeScript program.
# `@deepseek-ai/dsh-agent-tool-presentation` (mode: ptc) is deprecated since
# dsh 0.2.2-rc.1 — mount `dsh-tool-executor-ptc` directly, like the shipped
# preset does.
- id: tool-executor-ptc
  name: '@deepseek-ai/dsh-tool-executor-ptc'
